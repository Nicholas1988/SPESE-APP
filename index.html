<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Spese e budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --surface:#0C0D10; --surface-2:#14161B; --ink:#F2F4F8; --muted:#8A92A3; --line:#1E2128;
  --accent:#6E93FF; --accent-ink:#050711; --ok:#4CC38A; --warn:#F0A64B; --bad:#F27B70; --track:#1A1D24;
  --glass-edge:rgba(255,255,255,.16);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh;display:flex;flex-direction:column}
body.lock{overflow:hidden}
html,body,button,input,label{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Su touchscreen elimina il flash blu di focus dopo il tap; mantiene il focus da tastiera su desktop. */
@media (hover:none) and (pointer:coarse){.nav button:focus,.nav button:focus-visible{outline:none;box-shadow:none;-webkit-tap-highlight-color:transparent}}
.nav button{-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;width:100%;margin:0 auto;padding:0 18px 150px;flex:1}
.vh{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px}
.top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-0.01em}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.round svg{width:18px;height:18px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin:18px 0 0}

/* hero */
.hero{padding:18px 0 6px}
.hero .lab{margin:0;color:var(--muted);font-weight:600}
.hero .big{margin:2px 0 14px;font-size:58px;line-height:1;font-weight:800;letter-spacing:-0.035em}
.hero .big.bad{color:var(--bad)}
.meter{position:relative;height:14px;border-radius:7px;background:var(--track)}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent);min-width:0}
.meter .fill.warn{background:var(--warn)}
.meter .fill.bad{background:var(--bad)}
.meter .tick{position:absolute;top:-5px;width:3px;height:24px;border-radius:2px;background:var(--ink);transform:translateX(-1.5px)}
.meter-meta{display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font-weight:600;font-size:13px}
.pace{margin:12px 0 0;font-weight:600}
.pace.ok{color:var(--ok)} .pace.warn{color:var(--warn)}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}

/* sections */
section{margin-top:30px}
h2{font-size:15px;font-weight:700;margin:0 0 10px;letter-spacing:-0.005em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.empty{color:var(--muted);padding:6px 0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 4px}
.summary div{padding:0 12px;display:grid;gap:2px}
.summary div+div{border-left:1px solid var(--line)}
.summary span{color:var(--muted);font-size:13px;font-weight:600}
.summary b{font-size:18px;font-weight:800;letter-spacing:-0.01em}
.summary b.pos{color:var(--ok)} .summary b.neg{color:var(--bad)}
.row .a.inc{color:var(--ok)}

/* alerts */
.alerts{display:grid;gap:8px}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;font-weight:600}
.alert.bad{border-left-color:var(--bad)}

/* category rows */
.crow{padding:12px 16px}
.crow+.crow{border-top:1px solid var(--line)}
.crow-top{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.cname{flex:1;font-weight:600}
.camt{font-weight:700}
.camt small{color:var(--muted);font-weight:500;font-size:13px}
.camt.bad{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--track);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px;padding:16px}
.donut{width:150px;height:150px;flex:none}
.donut text{fill:var(--ink);font-family:inherit}
.donut .dn{font-size:17px;font-weight:800}
.donut .ds{font-size:9.5px;fill:var(--muted);font-weight:600}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:0}
.legend li{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.legend li span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend li b{color:var(--muted);font-weight:600}

/* history */
.hist{padding:14px 12px 8px}
.hist svg{width:100%;height:auto;display:block}
.hist text{font-family:inherit;fill:var(--muted);font-size:10px;font-weight:600}
.hist .v{fill:var(--ink)}

/* report annuale */
.kpis{display:grid;grid-template-columns:1fr 1fr}
.kpis div{padding:14px 16px;display:grid;gap:2px}
.kpis div:nth-child(odd){border-right:1px solid var(--line)}
.kpis div:nth-child(n+3){border-top:1px solid var(--line)}
.kpis span{color:var(--muted);font-size:13px;font-weight:600}
.kpis b{font-size:22px;font-weight:800;letter-spacing:-0.02em}
.kpis b.pos{color:var(--ok)} .kpis b.neg{color:var(--bad)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}
.seg button{border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:rgba(255,255,255,.11);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.chart{padding:14px 10px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit;fill:var(--muted);font-size:9.5px;font-weight:600}
.legend-h{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.legend-h span{display:inline-flex;align-items:center;gap:6px}
.ld{width:9px;height:9px;border-radius:3px;display:inline-block}
.ld.dash{height:0;width:14px;border-radius:0;border-top:2px dashed var(--warn)}
.detail{margin-top:12px}
.detail .dh{margin:0;padding:14px 16px 0;font-size:15px;font-weight:700}
.detail .summary{padding-top:10px}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px}
.hrow+.hrow{border-top:1px solid var(--line)}
.hrow span{color:var(--muted);font-weight:600}
.hrow b{font-weight:700;text-align:right}

/* list */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{width:8px;height:8px}
.dayhead{display:flex;justify-content:space-between;margin:22px 2px 8px;color:var(--muted);font-weight:600;font-size:13px}
.rows{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 16px}
.row+.row{border-top:1px solid var(--line)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px}
.row .a{font-weight:700}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;font-size:11.5px;font-weight:600}
.tgl{width:46px;height:28px;border-radius:14px;background:var(--track);position:relative;flex:none;transition:background .2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{background:var(--ok)}
.tgl.on::after{transform:translateX(18px)}

/* forms & buttons */
label.f{display:block;font-weight:600;font-size:13px;color:var(--muted);margin:16px 0 6px}
input.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;min-height:46px}
input.amount{font-size:32px;font-weight:800;letter-spacing:-0.02em;padding:10px 14px}
.chipgrid{display:flex;flex-wrap:wrap;gap:8px}
.btn{width:100%;border-radius:12px;padding:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);margin-top:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.scan{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;background:var(--surface-2)}
.btn.scan svg{width:21px;height:21px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:10px 2px 4px}
.scanbox{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.scanbox img{width:44px;height:58px;object-fit:cover;border-radius:8px;flex:none;background:var(--track)}
.scanbox .st{font-weight:700}
.pbar{height:5px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:9px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.errmsg{color:var(--bad);font-weight:600;margin:12px 0 0;min-height:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0;background-clip:padding-box;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--ink)}

/* cambio schermata */
#app{position:relative;width:100%}
/* Transizione leggera: evita trasformazioni e blur che possono interferire
   con la barra fixed e il backdrop-filter sui browser mobile. */
#app.swap{animation:swap .14s ease-out}
@keyframes swap{
  from{opacity:.88}
  to{opacity:1}
}

/* barra in vetro (liquid glass) */
.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;z-index:20;border-radius:34px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(10,11,15,.55);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.75)}
.nav .in{position:relative;display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.lens{position:absolute;top:6px;bottom:6px;left:0;width:0;transition:left .22s ease,width .22s ease;pointer-events:none}
.lens i{position:absolute;inset:0;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -8px 14px rgba(255,255,255,.05),0 6px 16px rgba(0,0,0,.5)}
.lens.go i{animation:squish .24s ease}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.04,.97)}70%{transform:scale(.99,1.01)}100%{transform:scale(1)}}
.nav button{position:relative;z-index:1;border:0;background:none;padding:9px 0 8px;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:26px;transition:color .25s,transform .15s}
.nav button.on{color:var(--ink)}
.nav button:active{transform:scale(.92)}
.nav svg{width:22px;height:22px}

#fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;z-index:15;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(0,0,0,.7)}
#fab svg{width:26px;height:26px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:none;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#overlay.open{display:flex}
#sheet{background:linear-gradient(180deg,rgba(36,39,49,.84),rgba(12,13,17,.92));-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--glass-edge);border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.grip{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);margin:4px auto 10px}
#sheet h3{margin:6px 0 0;font-size:20px;font-weight:800;letter-spacing:-0.01em}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:rgba(44,48,60,.78);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--glass-edge);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;display:none;max-width:90%;text-align:center}
#toast.bad{background:rgba(192,54,44,.85);color:#fff}
@media (prefers-reduced-motion:no-preference){
  #sheet{animation:up .26s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:reduce){
  .lens{transition:none}
  .lens.go i{animation:none}
  #app.swap{animation:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<button id="fab" aria-label="Aggiungi spesa" data-act="add">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" aria-label="Navigazione">
  <div class="in">
    <span class="lens" id="lens" aria-hidden="true"><i></i></span>
    <button data-act="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"/></svg>Riepilogo
    </button>
    <button data-act="tab" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Spese
    </button>
    <button data-act="tab" data-tab="income">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Entrate
    </button>
    <button data-act="tab" data-tab="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Report
    </button>
    <button data-act="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Impostazioni
    </button>
  </div>
</nav>

<div id="overlay" data-act="overlay"><div id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div id="sheet-body"></div></div></div>
<div id="toast" role="status"></div>
<label id="hx" class="vh" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script>
(function(){
'use strict';
var $ = function(s){return document.querySelector(s)};
var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid = function(){return Math.random().toString(36).slice(2,9)};
var pad = function(n){return String(n).padStart(2,'0')};
var KEY = 'spese-budget-v1';

/* ---------- dati ---------- */
var DEF = {
  budget:0,
  categories:[
    {id:'casa',name:'Casa',color:'#3B6FD8',budget:500},
    {id:'spesa',name:'Spesa',color:'#2E9E6B',budget:300},
    {id:'trasporti',name:'Trasporti',color:'#E0A030',budget:100},
    {id:'svago',name:'Svago',color:'#B15AC9',budget:100},
    {id:'salute',name:'Salute',color:'#D9534F',budget:50},
    {id:'altro',name:'Altro',color:'#7B8794',budget:0}
  ],
  expenses:[],
  recurring:[],
  income:[],
  haptics:true
};
var S = load();
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw), d = clone(DEF);
      return {budget:typeof p.budget==='number'?p.budget:d.budget, categories:Array.isArray(p.categories)?p.categories:d.categories, expenses:Array.isArray(p.expenses)?p.expenses:[], recurring:Array.isArray(p.recurring)?p.recurring:[], income:Array.isArray(p.income)?p.income:[], haptics:p.haptics!==false};
    }
  }catch(e){}
  return clone(DEF);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- utilità ---------- */
var nf0 = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0});
var nf2 = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(n){ n = Math.round(n*100)/100; return Number.isInteger(n)? nf0.format(n) : nf2.format(n); }
function num(v){
  var s = String(v==null?'':v).trim().replace(/\s/g,'');
  if(s.indexOf(',')>-1) s = s.replace(/\./g,'').replace(',','.');
  var n = parseFloat(s); return isFinite(n)? n : NaN;
}
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mk(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function ym(m){ var a=m.split('-'); return [Number(a[0]),Number(a[1])]; }
function daysIn(m){ var a=ym(m); return new Date(a[0],a[1],0).getDate(); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function monthLabel(m){ var a=ym(m); return cap(new Date(a[0],a[1]-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})); }
function monthShort(m){ var a=ym(m); return new Date(a[0],a[1]-1,1).toLocaleDateString('it-IT',{month:'short'}).replace('.',''); }
function shiftMonth(m,n){ var a=ym(m); return mk(new Date(a[0],a[1]-1+n,1)); }
function dayLabel(d){ return cap(new Date(d+'T00:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'')); }

var view = {tab:'home', month:mk(new Date()), filter:'all', year:new Date().getFullYear(), rsel:null, rmode:'flow'};
var draft = {};

function catOf(id){
  for(var i=0;i<S.categories.length;i++) if(S.categories[i].id===id) return S.categories[i];
  return {id:id,name:'Senza categoria',color:'#98A2B3',budget:0};
}
function monthItems(m,noFuture){
  var items = S.expenses.filter(function(e){return e.date.indexOf(m)===0}).map(function(e){return {id:e.id,date:e.date,amount:e.amount,cat:e.cat,note:e.note,rec:false}});
  var dim = daysIn(m);
  S.recurring.forEach(function(r){
    if(r.start<=m && (!noFuture || m<=mk(new Date()))) items.push({id:'r:'+r.id,rid:r.id,date:m+'-'+pad(Math.min(r.day,dim)),amount:r.amount,cat:r.cat,note:r.name,rec:true});
  });
  return items;
}
function incomeOf(m){ return S.income.filter(function(e){return e.date.indexOf(m)===0}); }
function sum(items){ return items.reduce(function(a,i){return a+i.amount},0); }
function byCat(items){ var t={}; items.forEach(function(i){t[i.cat]=(t[i.cat]||0)+i.amount}); return t; }

  '</div>';
}

function homeHTML(){

  var lab, big, bigCls='';
  if(budget<=0){ lab='Spesi questo mese'; big=fmt(spent); }
  else if(left>=0){ lab='Ti restano'; big=fmt(left); }
  else { lab='Hai sforato di'; big=fmt(-left); bigCls=' bad'; }

  var fillCls = pct>1?'bad':(pct>=0.8?'warn':'');
  var fillW = Math.min(100,Math.max(0,pct*100));
  var paceHTML = '';

  var inc = sum(incomeOf(m)), bal = inc-spent;

    (bal>0?'<p class="hint">Stai mettendo da parte il '+Math.round(bal/inc*100)+'% delle entrate.</p>':(bal<0?'<p class="hint">Le spese superano le entrate di '+fmt(-bal)+'.</p>':''))
    : '<div class="card pad"><p class="empty" style="margin:0">Non hai ancora inserito entrate per questo mese.</p><button class="btn" data-act="tab" data-tab="income">Aggiungi lo stipendio</button></div>')+'</section>';

  var alerts = [];
  if(budget>0){
    if(spent>budget) alerts.push({t:'bad',x:'Budget mensile sforato di '+fmt(spent-budget)});
    else if(pct>=0.8) alerts.push({t:'warn',x:'Hai usato il '+Math.round(pct*100)+'% del budget mensile'});
  }
  S.categories.forEach(function(c){
    if(c.budget>0){
      var s = tot[c.id]||0;
      if(s>c.budget) alerts.push({t:'bad',x:c.name+': sforato di '+fmt(s-c.budget)});
      else if(s/c.budget>=0.8) alerts.push({t:'warn',x:c.name+': usato il '+Math.round(s/c.budget*100)+'%'});
    }
  });
  var alertsHTML = alerts.length ? '<section><h2>Da tenere d’occhio</h2><div class="alerts">'+alerts.map(function(a){return '<div class="alert '+a.t+'">'+esc(a.x)+'</div>'}).join('')+'</div></section>' : '';

  /* categorie */
  var list = S.categories.slice();
  var known = {}; S.categories.forEach(function(c){known[c.id]=1});
  Object.keys(tot).forEach(function(k){ if(!known[k]) list.push(catOf(k)); });
  list = list.filter(function(c){return (tot[c.id]||0)>0 || c.budget>0}).sort(function(a,b){return (tot[b.id]||0)-(tot[a.id]||0)});
  var catsHTML = '<section><h2>Budget per categoria</h2><div class="card">'+
    (list.length ? list.map(function(c){
      var s = tot[c.id]||0, over = c.budget>0 && s>c.budget;
      var bar = c.budget>0 ? '<div class="bar"><i style="width:'+Math.min(100,s/c.budget*100)+'%;background:'+(over?'var(--bad)':c.color)+'"></i></div>' : '';
      return '<div class="crow"><div class="crow-top"><span class="dot" style="background:'+c.color+'"></span><span class="cname">'+esc(c.name)+'</span>'+
        '<span class="camt'+(over?' bad':'')+'">'+fmt(s)+(c.budget>0?' <small>/ '+fmt(c.budget)+'</small>':'')+'</span></div>'+bar+'</div>';
    }).join('') : '<div class="pad empty">Nessuna categoria con spese o budget in questo mese.</div>')+
  '</div></section>';

  /* ciambella */
  var entries = Object.keys(tot).map(function(k){var c=catOf(k);return {name:c.name,color:c.color,v:tot[k]}}).filter(function(e){return e.v>0}).sort(function(a,b){return b.v-a.v});
  var donutHTML = '<section><h2>Dove vanno i soldi</h2><div class="card">'+
    (entries.length ? '<div class="donut-wrap">'+donut(entries,spent)+'<ul class="legend">'+entries.slice(0,6).map(function(e){
      return '<li><span class="dot" style="background:'+e.color+'"></span><span class="n">'+esc(e.name)+'</span><b>'+Math.round(e.v/spent*100)+'%</b></li>';
    }).join('')+'</ul></div>' : '<div class="pad empty">Aggiungi la prima spesa con il tasto + per vedere come si distribuisce il mese.</div>')+
  '</div></section>';

  return headerHTML()+hero+balHTML+alertsHTML+catsHTML+donutHTML+'<section><h2>Ultimi 6 mesi</h2><div class="card hist">'+history()+'</div></section>';

function donut(entries,total){
  var r=54, c=2*Math.PI*r, off=0;
  var segs = entries.map(function(e){
    var len = e.v/total*c;
    var s = '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+e.color+'" stroke-width="18" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';
    off += len; return s;
  }).join('');
  return '<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Spese per categoria"><circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="18"/>'+segs+
    '<text class="dn" x="70" y="72" text-anchor="middle">'+fmt(total)+'</text><text class="ds" x="70" y="86" text-anchor="middle">spesi</text></svg>';
}

function history(){
  var ms=[], i;
  for(i=5;i>=0;i--) ms.push(shiftMonth(view.month,-i));
  var vals = ms.map(function(m){return sum(monthItems(m))});
  var max = Math.max.apply(null, vals.concat([S.budget,1]));
  var base=112, H=88, out='';
  if(S.budget>0){
    var by = base - S.budget/max*H;
    out += '<line x1="4" x2="316" y1="'+by+'" y2="'+by+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>';
  }
  ms.forEach(function(m,idx){
    var x = 12 + idx*52, h = vals[idx]/max*H, last = idx===5;
    var over = S.budget>0 && vals[idx]>S.budget;
    var color = over ? 'var(--bad)' : 'var(--accent)';
    if(vals[idx]>0) out += '<rect x="'+x+'" y="'+(base-h)+'" width="34" height="'+h+'" rx="5" fill="'+color+'" opacity="'+(last?1:0.45)+'"/>';
    else out += '<rect x="'+x+'" y="'+(base-2)+'" width="34" height="2" rx="1" fill="var(--track)"/>';
    if(vals[idx]>0) out += '<text class="v" x="'+(x+17)+'" y="'+(base-h-5)+'" text-anchor="middle">'+nf0.format(Math.round(vals[idx])).replace(/\s?€/,'')+'</text>';
    out += '<text x="'+(x+17)+'" y="128" text-anchor="middle">'+monthShort(m)+'</text>';
  });
  return '<svg viewBox="0 0 320 136" role="img" aria-label="Spesa totale degli ultimi sei mesi">'+out+'</svg>'+(S.budget>0?'<p class="hint" style="margin:0 6px 8px">La linea tratteggiata è il budget mensile.</p>':'');
}

  items.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });

            '<span class="a">'+fmt(i.amount)+'</span></button>';
        }).join('')+'</div>';
    }).join('');

  return headerHTML()+chips+body;

function incomeHTML(){
  var m = view.month, items = incomeOf(m).slice().sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });

/* ---------- report annuale ---------- */
var MONTHS_S = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
function yearData(y){
  var cur = mk(new Date()), out = [], i;
  for(i=1;i<=12;i++){
    var m = y+'-'+pad(i), items = monthItems(m,true);
    out.push({m:m, spent:sum(items), income:sum(incomeOf(m)), cats:byCat(items), future:m>cur});
  }
  return out;
}
function niceStep(v){
  if(!(v>0)) return 25;
  var raw = v/4, p = Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), f = raw/p, c = [1,1.5,2,2.5,3,4,5,6,8,10], i;
  for(i=0;i<c.length;i++) if(f<=c[i]+1e-9) return c[i]*p;
  return 10*p;
}
function kfmt(n){ return n>=1000 ? (n/1000).toLocaleString('it-IT',{maximumFractionDigits:1})+'k' : String(Math.round(n)); }
function catOrder(data){
  var ids = S.categories.map(function(c){return c.id}), seen = {};
  ids.forEach(function(i){seen[i]=1});
  data.forEach(function(d){ Object.keys(d.cats).forEach(function(k){ if(!seen[k]){seen[k]=1; ids.push(k);} }); });
  return ids;
}
function yearHeaderHTML(){
  return '<div class="top">'+
    '<button class="round" data-act="yprev" aria-label="Anno precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>'+
    '<h1>Report '+view.year+'</h1>'+
    '<button class="round" data-act="ynext" aria-label="Anno successivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>'+
  '</div>';
}
function reportChart(data,mode,sel){
  var W=360, H=212, L=32, R=6, T=10, B=24, pw=W-L-R, ph=H-T-B, cw=pw/12;
  var maxv = 0;
  data.forEach(function(d){ maxv = Math.max(maxv, d.spent, mode==='flow'?d.income:0); });
  if(mode==='flow' && S.budget>0) maxv = Math.max(maxv,S.budget);
  var step = niceStep(maxv), top = step*4;
  var yv = function(v){ return T+ph-(v/top)*ph; };
  var o = '', i;
  for(i=0;i<=4;i++){
    var gy = yv(step*i);
    o += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="rgba(255,255,255,'+(i?'.07':'.16')+')" stroke-width="1"/>'+
      (i?'<text x="'+(L-5)+'" y="'+(gy+3)+'" text-anchor="end">'+kfmt(step*i)+'</text>':'');
  }
  if(sel!=null && sel>=0) o += '<rect x="'+(L+sel*cw+1)+'" y="'+T+'" width="'+(cw-2)+'" height="'+ph+'" rx="7" fill="rgba(255,255,255,.07)"/>';
  var order = catOrder(data);
  data.forEach(function(d,idx){
    var mid = L+idx*cw+cw/2;
    if(mode==='flow'){
      if(d.income>0){ var h1 = d.income/top*ph; o += '<rect x="'+(mid-10)+'" y="'+(T+ph-h1)+'" width="9" height="'+h1+'" rx="2.5" fill="var(--ok)"/>'; }
      if(d.spent>0){ var h2 = d.spent/top*ph, over = S.budget>0 && d.spent>S.budget; o += '<rect x="'+(mid+1)+'" y="'+(T+ph-h2)+'" width="9" height="'+h2+'" rx="2.5" fill="'+(over?'var(--bad)':'var(--accent)')+'"/>'; }
    } else if(d.spent>0){
      var bw = 17, x0 = mid-bw/2, acc = 0, hT = d.spent/top*ph;
      o += '<clipPath id="rc'+idx+'"><rect x="'+x0+'" y="'+(T+ph-hT)+'" width="'+bw+'" height="'+hT+'" rx="3"/></clipPath><g clip-path="url(#rc'+idx+')">';
      order.forEach(function(id){
        var v = d.cats[id]||0; if(v<=0) return;
        var hh = v/top*ph, yy = T+ph-(acc+v)/top*ph;
        o += '<rect x="'+x0+'" y="'+yy+'" width="'+bw+'" height="'+hh+'" fill="'+catOf(id).color+'"/>'; acc += v;
      });
      o += '</g>';
    }
    o += '<text x="'+mid+'" y="'+(H-7)+'" text-anchor="middle"'+(idx===sel?' style="fill:var(--ink)"':(d.future?' style="opacity:.45"':''))+'>'+MONTHS_S[idx]+'</text>';
    o += '<rect x="'+(L+idx*cw)+'" y="'+T+'" width="'+cw+'" height="'+(ph+B)+'" fill="transparent" data-act="rmonth" data-v="'+idx+'" style="cursor:pointer"/>';
  });
  if(mode==='flow' && S.budget>0){
    var by = yv(S.budget);
    o += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+by+'" y2="'+by+'" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="4 4"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafico annuale delle spese">'+o+'</svg>';
}
function reportHTML(){
  var y = view.year, data = yearData(y), spent = 0, inc = 0, first = -1, last = -1, yc = {};
  data.forEach(function(d,idx){
    spent += d.spent; inc += d.income;
    Object.keys(d.cats).forEach(function(k){ yc[k] = (yc[k]||0)+d.cats[k]; });
    if(d.spent>0 || d.income>0){ if(first<0) first = idx; last = Math.max(last,idx); }
    if(!d.future) last = Math.max(last,idx);
  });
  if(first<0){
    return yearHeaderHTML()+'<section><div class="card pad"><p class="empty" style="margin:0">Nessun dato per il '+y+'. Le spese e le entrate che inserisci compaiono qui, mese per mese.</p></div></section>';
  }
  var bal = inc-spent, count = last-first+1, avg = spent/count;
  var mode = view.rmode, sel = view.rsel!=null ? view.rsel : last;

  var kpis = '<section><div class="card kpis">'+
    '<div><span>Spese</span><b>'+fmt(spent)+'</b></div>'+
    '<div><span>Entrate</span><b>'+fmt(inc)+'</b></div>'+
    '<div><span>Saldo</span><b class="'+(inc>0?(bal<0?'neg':'pos'):'')+'">'+(inc>0?fmt(bal):'—')+'</b></div>'+
    '<div><span>Media al mese</span><b>'+fmt(avg)+'</b></div></div>'+
    (inc>0 ? (bal>0 ? '<p class="hint">Nel '+y+' hai messo da parte il '+Math.round(bal/inc*100)+'% delle entrate.</p>' : (bal<0 ? '<p class="hint">Nel '+y+' hai speso '+fmt(-bal)+' più di quanto hai incassato.</p>':'')) : '<p class="hint">Aggiungi le entrate nella scheda Entrate per vedere il saldo.</p>')+
  '</section>';

  var legend;
  if(mode==='flow'){
    legend = '<span><i class="ld" style="background:var(--ok)"></i>Entrate</span><span><i class="ld" style="background:var(--accent)"></i>Spese</span>'+(S.budget>0?'<span><i class="ld dash"></i>Budget</span>':'');
  } else {
    legend = catOrder(data).filter(function(id){return (yc[id]||0)>0}).map(function(id){ var c = catOf(id); return '<span><i class="ld" style="background:'+c.color+'"></i>'+esc(c.name)+'</span>'; }).join('');
  }

  var d = data[sel], detail = '';
  if(d){
    if(mode==='flow'){
      var b2 = d.income-d.spent;
      detail = '<div class="card detail"><h3 class="dh">'+monthLabel(d.m)+'</h3><div class="card summary" style="border:0;background:none"><div><span>Entrate</span><b>'+fmt(d.income)+'</b></div><div><span>Spese</span><b>'+fmt(d.spent)+'</b></div><div><span>Saldo</span><b class="'+(b2<0?'neg':'pos')+'">'+fmt(b2)+'</b></div></div></div>';
    } else {
      var rows = Object.keys(d.cats).map(function(k){return {c:catOf(k),v:d.cats[k]}}).sort(function(a,b){return b.v-a.v}).slice(0,6);
      detail = '<div class="card detail"><h3 class="dh">'+monthLabel(d.m)+' · '+fmt(d.spent)+'</h3>'+
        (rows.length ? rows.map(function(r){
          return '<div class="crow"><div class="crow-top"><span class="dot" style="background:'+r.c.color+'"></span><span class="cname">'+esc(r.c.name)+'</span><span class="camt">'+fmt(r.v)+' <small>'+Math.round(r.v/d.spent*100)+'%</small></span></div></div>';
        }).join('') : '<div class="pad empty">Nessuna spesa in questo mese.</div>')+'</div>';
    }
  }

  var chartSec = '<section><h2>Mese per mese</h2>'+
    '<div class="seg"><button class="'+(mode==='flow'?'on':'')+'" data-act="rmode" data-v="flow">Entrate e spese</button><button class="'+(mode==='cat'?'on':'')+'" data-act="rmode" data-v="cat">Per categoria</button></div>'+
    '<div class="card chart" style="margin-top:12px">'+reportChart(data,mode,sel)+'<div class="legend-h">'+legend+'</div></div>'+
    '<p class="hint">Tocca un mese nel grafico per vederne il dettaglio.</p>'+detail+'</section>';

  var crow = Object.keys(yc).map(function(k){return {c:catOf(k),v:yc[k]}}).filter(function(r){return r.v>0}).sort(function(a,b){return b.v-a.v});
  var catSec = '<section><h2>Categorie del '+y+'</h2><div class="card">'+
    crow.map(function(r){
      return '<div class="crow"><div class="crow-top"><span class="dot" style="background:'+r.c.color+'"></span><span class="cname">'+esc(r.c.name)+'</span><span class="camt">'+fmt(r.v)+' <small>'+Math.round(r.v/spent*100)+'%</small></span></div>'+
        '<div class="bar"><i style="width:'+(r.v/crow[0].v*100)+'%;background:'+r.c.color+'"></i></div>'+
        '<div class="sub">'+fmt(r.v/count)+' al mese</div></div>';
    }).join('')+'</div></section>';

  var peak = null, light = null;
  data.forEach(function(x,idx){
    if(x.spent>0 && (!peak || x.spent>peak.spent)) peak = x;
    if(x.spent>0 && !x.future && idx>=first && (!light || x.spent<light.spent)) light = x;

/* ---------- lettura scontrini ---------- */
/* PARSE-START */
var KW = [
  [/totale\s+complessivo/i,120],
  [/totale\s+(?:euro|eur|€)/i,115],
  [/importo\s+(?:pagato|da\s+pagare|totale)/i,110],
  [/da\s+pagare/i,110],
  [/\btotale\b/i,100],
  [/\bimporto\b/i,60],
  [/pagamento\s+(?:elettronico|carta|bancomat|pos)|\b(?:bancomat|carta|pos|visa|mastercard)\b/i,70],
  [/subtotale/i,30],
  [/contanti/i,40]
];
var SKIPRE = /\b(?:resto|iva|imponibile|imposta|sconto|punti)\b/i;
function parseAmounts(line){
  var out = [], re = /(\d{1,3}(?:[.\s]\d{3})+|\d+)\s?[.,]\s?(\d{2})(?!\d)/g, m;
  while((m = re.exec(line))){
    var v = parseFloat(m[1].replace(/[.\s]/g,'')+'.'+m[2]);
    if(isFinite(v)) out.push(v);
  }
  return out;
}
function cleanLine(l){
  return l.replace(/\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/g,' ').replace(/\b\d{1,2}:\d{2}(?::\d{2})?\b/g,' ').replace(/\d+(?:[.,]\d+)?\s?%/g,' ');
}
function parseDate(text){
  var re = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/g, m, now = new Date();
  while((m = re.exec(text))){
    var d = +m[1], mo = +m[2], y = +m[3];
    if(y<100) y += 2000;
    if(d<1 || d>31 || mo<1 || mo>12 || y<2000) continue;
    var dt = new Date(y,mo-1,d);
    if(dt.getMonth()!==mo-1 || dt>now) continue;
    return y+'-'+pad(mo)+'-'+pad(d);
  }
  return null;
}
function guessMerchant(lines){
  var j, n = Math.min(lines.length,6);
  for(j=0;j<n;j++){
    var l = lines[j].replace(/[^A-Za-zÀ-ÿ0-9 .&'\-]/g,' ').replace(/\s+/g,' ').trim();
    var letters = (l.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
    if(letters<4 || l.length>34 || letters/l.length<0.7) continue;
    if(/scontrino|documento|fiscale|commerciale|www\.|http|\bvia\b|\bviale\b|piazza|p\.?\s?iva|\btel\b|cassa|arrivederci|grazie/i.test(l)) continue;
    if(l===l.toUpperCase()) l = l.toLowerCase().replace(/(^|[\s\-'])([a-zà-ÿ])/g,function(x,a,b){return a+b.toUpperCase();});
    return l;
  }
  return '';
}
function parseReceipt(text){
  var lines = String(text||'').split(/\r?\n/).map(function(l){return l.trim()}).filter(function(l){return l.length});
  var cand = [], restoV = null, i;
  for(i=0;i<lines.length;i++){
    var raw = lines[i], normalized = raw.replace(/[€]/g,' ').replace(/\bEUR\b/ig,' '), amts = parseAmounts(cleanLine(normalized));
    if(/\bresto\b/i.test(raw)){ if(amts.length) restoV = amts[amts.length-1]; continue; }
    if(SKIPRE.test(raw) || /\b(?:codice|articolo|quantità|quantita|pezzi|punti|operatore|transazione|terminal|autorizzazione)\b/i.test(raw)) continue;
    var sc = 0, k;
    for(k=0;k<KW.length;k++) if(KW[k][0].test(raw) && KW[k][1]>sc) sc = KW[k][1];
    if(sc>0){
      if(!amts.length && i+1<lines.length && !SKIPRE.test(lines[i+1]) && !/[A-Za-zÀ-ÿ]{4,}/.test(lines[i+1])){
        amts = parseAmounts(cleanLine(lines[i+1])); sc -= 5;
      }
      if(amts.length) cand.push({v:amts[amts.length-1], s:sc, line:i});
    } else if(amts.length){
      /* Le cifre senza etichetta sono candidate deboli: non devono vincere
         automaticamente su un importo totale riconosciuto. */
      amts.forEach(function(v){ cand.push({v:v, s:10, line:i}); });
    }
  }
  cand = cand.filter(function(c){ return c.v>0 && c.v<10000 && isFinite(c.v); }).map(function(c){ return {v:Math.round(c.v*100)/100, s:c.s, line:c.line}; });
  cand.sort(function(a,b){ return b.s-a.s || b.line-a.line || b.v-a.v; });
  var amount = null;
  if(cand.length && cand[0].s>=60){
    amount = cand[0].v;
    if(cand[0].s===40 && restoV!==null && cand[0].v>restoV) amount = Math.round((cand[0].v-restoV)*100)/100;
  } else {
    /* Se OCR perde la parola TOTALE, cerca solo nella parte finale dello scontrino
       e privilegia importi realistici; evita di scegliere numeri casuali in alto. */
    var minLine = Math.floor(lines.length*0.55), tail = cand.filter(function(c){ return c.line>=minLine && c.s===10 && c.v>=0.5; });
    if(tail.length){
      tail.sort(function(a,b){ return b.line-a.line || b.v-a.v; });
      amount = tail[0].v;
    }
  }
  var seen = {}, others = [];
  if(amount!==null) seen[amount] = 1;
  cand.forEach(function(c){ if(!seen[c.v] && others.length<4 && c.s>=10){ seen[c.v] = 1; others.push(c.v); } });
  return {amount:amount, candidates:others, date:parseDate(text||''), merchant:guessMerchant(lines)};
}

function loadTess(){
  if(window.Tesseract) return Promise.resolve();

  });

function prepImage(file){
  return new Promise(function(res,rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, h = img.naturalHeight, big = Math.max(w,h), sc = 1;
        if(big>2400) sc = 2400/big; else if(big<1400) sc = 1400/big;
        var c = document.createElement('canvas');
        c.width = Math.max(1,Math.round(w*sc)); c.height = Math.max(1,Math.round(h*sc));
        var x = c.getContext('2d',{willReadFrequently:true});
        x.drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        var d = x.getImageData(0,0,c.width,c.height), p = d.data, hist = new Uint32Array(256), i, n = p.length/4;
        for(i=0;i<p.length;i+=4){ var g = (p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)|0; p[i] = g; hist[g]++; }
        var lo = 0, hi = 255, acc = 0;
        for(i=0;i<256;i++){ acc += hist[i]; if(acc>=n*0.01){ lo = i; break; } }
        acc = 0;
        for(i=255;i>=0;i--){ acc += hist[i]; if(acc>=n*0.01){ hi = i; break; } }
        var span = Math.max(40,hi-lo);
        for(i=0;i<p.length;i+=4){ var v = (p[i]-lo)*255/span; v = v<0?0:(v>255?255:v); p[i] = p[i+1] = p[i+2] = v; p[i+3] = 255; }
        x.putImageData(d,0,0);
        res(c);
      }catch(err){ rej(err); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function scanHTML(){
  return '<div id="scan"><button class="btn scan" data-act="scan-camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Scansiona scontrino</button>'+
    '<button class="linkbtn" data-act="scan-gallery">Scegli dalla galleria</button>'+
    '<input class="vh" type="file" id="scan-cam" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">'+
    '<input class="vh" type="file" id="scan-gal" accept="image/*" tabindex="-1" aria-hidden="true">'+
    '<div id="scan-status" aria-live="polite"></div></div>';
}
function scanBox(title,sub,pct,extra){
  return '<div class="scanbox">'+(scanThumb?'<img src="'+scanThumb+'" alt="">':'')+'<div style="flex:1;min-width:0"><div class="st">'+esc(title)+'</div>'+
    (sub?'<div class="hint" style="margin:2px 0 0">'+esc(sub)+'</div>':'')+
    (pct!=null?'<div class="pbar"><i style="width:'+pct+'%"></i></div>':'')+(extra||'')+'</div></div>';
}
function scanShow(html){ var b = $('#scan-status'); if(b) b.innerHTML = html; }
function applyScan(out){
  var amt = $('#f-amount'); if(!amt) return;
  if(out.amount===null){
    scanShow(scanBox('Nessuna cifra trovata','Prova con più luce e lo scontrino ben disteso, oppure scrivila a mano.'));
    return;
  }
  amt.value = out.amount.toFixed(2).replace('.',',');
  if(out.date && $('#f-date')) $('#f-date').value = out.date;
  var note = $('#f-note'); if(note && !note.value.trim() && out.merchant) note.value = out.merchant;
  var chips = out.candidates.length ? '<div class="hint" style="margin:10px 0 6px">Non è questa? Scegline un’altra:</div><div class="chipgrid">'+out.candidates.map(function(v){
    return '<button class="chip" data-act="scan-pick" data-v="'+v+'">'+fmt(v)+'</button>';
  }).join('')+'</div>' : '';
  scanShow(scanBox('Totale letto: '+fmt(out.amount),'Controlla che sia giusto prima di salvare.',null,chips));
}
async function handleScan(file){
  if(!file || scanBusy || !$('#scan-status')) return;
  scanBusy = true;
  if(scanThumb) URL.revokeObjectURL(scanThumb);
  scanThumb = URL.createObjectURL(file);
  scanShow(scanBox('Preparo la foto…','',5));
  try{
    var canvas = await prepImage(file);
    scanShow(scanBox('Carico il lettore…','La prima volta può volerci qualche secondo.',10));
    await loadTess();
    scanProg = function(m){
      if(m && m.status==='recognizing text'){ var p = $('#scan-status .pbar i'); if(p) p.style.width = (25+Math.round(m.progress*73))+'%'; }
    };
    scanWorker = await Tesseract.createWorker('ita',1,{logger:function(m){ if(scanProg) scanProg(m); }});
    scanShow(scanBox('Leggo lo scontrino…','',25));
    var res = await scanWorker.recognize(canvas, {tessedit_pageseg_mode: 6});
    applyScan(parseReceipt(res.data.text));
  }catch(err){
    scanShow(scanBox('Lettura non riuscita','Controlla la connessione (serve la prima volta) oppure inserisci la cifra a mano.'));
  }finally{
    scanProg = null; scanBusy = false;
    if(scanWorker){ try{ scanWorker.terminate(); }catch(e){} scanWorker = null; }
  }
}

/* ---------- eventi ---------- */
document.addEventListener('click', function(ev){
  var ae = document.activeElement;
  if(ae && ae.tagName==='INPUT' && !ev.target.closest('input,label')) ae.blur();
  var el = ev.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(act==='overlay'){ if(ev.target===el) closeSheet(); return; }

  /* azioni con doppio tocco */
  var twoTap = {'del-inc':1,'del-exp':1,'del-cat':1,'del-rec':1,'reset':1};
  if(twoTap[act] && !el.getAttribute('data-armed')){
    el.setAttribute('data-armed','1'); el.classList.add('armed'); el.textContent = 'Tocca ancora per confermare';
    return;
  }

  try{
  switch(act){
    case 'tab':
      var nt = el.getAttribute('data-tab');
      if(nt!==view.tab){ swapDir = TABS.indexOf(nt)>TABS.indexOf(view.tab) ? 1 : -1; view.tab = nt; render(true); }
      break;
    case 'yprev': view.year--; view.rsel = null; render(); break;
    case 'ynext': view.year++; view.rsel = null; render(); break;
    case 'rmode': view.rmode = el.getAttribute('data-v'); render(); break;
    case 'rmonth': view.rsel = parseInt(el.getAttribute('data-v'),10); render(); break;
    case 'toggle-haptics': S.haptics = !S.haptics; save(); render(); if(S.haptics) haptic(18); break;
    case 'scan-camera': var fc = $('#scan-cam'); if(fc) fc.click(); break;
    case 'scan-gallery': var fg = $('#scan-gal'); if(fg) fg.click(); break;
    case 'scan-pick':
      var fa = $('#f-amount');
      if(fa){ fa.value = Number(el.getAttribute('data-v')).toFixed(2).replace('.',','); }
      break;
    case 'prev': view.month = shiftMonth(view.month,-1); render(); break;
    case 'next': view.month = shiftMonth(view.month,1); render(); break;
    case 'filter': view.filter = el.getAttribute('data-v'); render(); break;
    case 'add': if(view.tab==='income') openIncome(null); else openExpense(null); break;
    case 'edit-inc': openIncome(el.getAttribute('data-id')); break;
    case 'save-inc': saveIncome(); break;
    case 'del-inc':
      S.income = S.income.filter(function(x){return x.id!==draft.id}); save(); closeSheet(); render(); toast('Entrata eliminata'); break;
    case 'copy-inc':
      var dim = daysIn(view.month);
      incomeOf(shiftMonth(view.month,-1)).forEach(function(e){
        var d = parseInt(e.date.slice(8,10),10);
        S.income.push({id:uid(),amount:e.amount,note:e.note,date:view.month+'-'+pad(Math.min(d,dim))});
      });
      save(); render(); toast('Entrate copiate dal mese scorso'); break;
    case 'edit-exp':
      var id = el.getAttribute('data-id');
      if(id.indexOf('r:')===0){ openRec(id.slice(2)); } else { openExpense(id); }
      break;
    case 'pick-cat':
      draft.cat = el.getAttribute('data-id');
      document.querySelectorAll('#catpick .chip').forEach(function(c){ c.classList.toggle('on', c===el); });
      break;
    case 'pick-color':
      draft.color = el.getAttribute('data-v');
      document.querySelectorAll('#sw .sw').forEach(function(c){ c.classList.toggle('on', c===el); });
      break;
    case 'save-exp': saveExpense(); break;
    case 'del-exp':
      S.expenses = S.expenses.filter(function(x){return x.id!==draft.id}); save(); closeSheet(); render(); toast('Spesa eliminata'); break;
    case 'cat-new': openCat(null); break;
    case 'cat-edit': openCat(el.getAttribute('data-id')); break;
    case 'save-cat': saveCat(); break;
    case 'del-cat':
      S.categories = S.categories.filter(function(x){return x.id!==draft.id}); save(); closeSheet(); render(); toast('Categoria eliminata'); break;
    case 'rec-new': openRec(null); break;
    case 'rec-edit': openRec(el.getAttribute('data-id')); break;
    case 'save-rec': saveRec(); break;
    case 'del-rec':
      S.recurring = S.recurring.filter(function(x){return x.id!==draft.id}); save(); closeSheet(); render(); toast('Spesa ricorrente eliminata'); break;
    case 'export':
      var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem(KEY) || JSON.stringify(DEF));
      var a = document.createElement('a');
      a.href = dataStr; a.download = "backup_spese.json";
      a.click();
      break;
    case 'import-btn':
      var fi = $('#import-file');
      if(fi) fi.click();
      break;
    case 'reset':
      S = clone(DEF); save(); view.filter='all'; render(); toast('Dati cancellati'); break;
    case 'close': closeSheet(); break;
  }
  }catch(err){ closeSheet(); toast('Qualcosa non ha funzionato. Riprova.','bad'); }
});
document.addEventListener('change', function(ev){
  if(ev.target && ev.target.id === 'import-file'){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var parsed = JSON.parse(e.target.result);
        if(parsed && typeof parsed === 'object'){
          localStorage.setItem(KEY, e.target.result);
          S = load(); view.filter='all'; render(); toast('Backup importato');
        } else {
          toast('File non valido', 'bad');
        }
      } catch(err) { toast('Errore file', 'bad'); }
    };
    reader.readAsText(file);
    ev.target.value = '';
    return;
  }
  if(ev.target && (ev.target.id==='scan-cam' || ev.target.id==='scan-gal')){
    var f = ev.target.files && ev.target.files[0]; ev.target.value = ''; handleScan(f); return;
  }
  if(ev.target && ev.target.id==='s-budget'){
    var v = ev.target.value.trim()===''?0:num(ev.target.value);
    if(!(v>=0)){ toast('Inserisci un numero valido','bad'); return; }
    S.budget = v; save();
    var cs = S.categories.reduce(function(a,c){return a+(c.budget||0)},0), h = $('#s-hint');
    if(h) h.textContent = 'Le categorie assegnano in tutto '+fmt(cs)+'.'+(S.budget>0 && cs>S.budget?' È più del budget mensile.':'');
    toast('Budget salvato');
  }
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape') closeSheet();
  if(ev.key==='Enter' && ev.target && ev.target.tagName==='INPUT' && $('#overlay').classList.contains('open')){
    var b = $('#sheet .btn.primary'); if(b){ ev.preventDefault(); b.click(); }
  }
});
if(window.visualViewport){
  var vv = window.visualViewport, ov = $('#overlay');
  var fit = function(){
    if(window.innerHeight - vv.height > 120){ ov.style.top = vv.offsetTop+'px'; ov.style.height = vv.height+'px'; ov.style.bottom = 'auto'; }
    else { ov.style.top = ''; ov.style.height = ''; ov.style.bottom = ''; }
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
}

window.addEventListener('resize', function(){ moveLens(false); });
render();
})();
